services:
  # Single container: the web UI is statically exported and embedded in the
  # Go binary, which serves it alongside the API on the same port.
  xrdb:
    image: ghcr.io/ibbylabs/xrdb:dev
    container_name: xrdb
    env_file:
      - path: .env
        required: false
    environment:
      XRDB_ADDR: ":8787"
      XRDB_DB: "/data/xrdb.db"
      XRDB_CACHE_DIR: "/data/cache"
    ports:
      - "8787:8787"
    volumes:
      - xrdb-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8787/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  xrdb-data:
