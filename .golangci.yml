version: "2"

linters:
  exclusions:
    paths:
      - web/node_modules
      - web/.next
      - web/out
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*net/http.Response).Body.Close
        - (*database/sql.Rows).Close
        - (*os.File).Close
        - (*compress/gzip.Reader).Close
        - (*compress/gzip.Writer).Close
