name: Product context
run-name: Refresh the product context for ${{ github.sha }}

# The community bot answers from public/product-context.json, fetched from the
# newest tag. Regenerating it on every push keeps the render options and the
# environment variables it quotes in step with the code, so the bot stops
# describing options that were renamed and starts describing ones that were
# added. The prose half lives in docs/product-context.md and is not touched.

on:
  push:
    branches:
      - main
    paths:
      - "docs/product-context.md"
      - "variables.md"
      - "internal/imageconfig/**"
      - "cmd/product-context/**"
      - ".github/workflows/product-context.yml"
  workflow_dispatch: {}

concurrency:
  group: product-context-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Dispatching ci.yml after the push needs this; contents alone returns 403
  # and the re-run silently never happens.
  actions: write

jobs:
  refresh:
    name: Regenerate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          # The generator stamps the newest tag, which a shallow clone lacks.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate
        run: go run ./cmd/product-context -root .

      - name: Commit when it changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- public/product-context.json; then
            echo "Already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/product-context.json
          # Two guards stop this triggering itself, and either alone would
          # hold: a GITHUB_TOKEN push starts no workflow, and
          # public/product-context.json is not in this workflow's own path
          # filter. The second is the one that survives a credential change —
          # swapping in a PAT to make pushes trigger things, which is the
          # standard fix and what our own CI notes reach for, deletes the first
          # and leaves this relying entirely on the filter above.
          git commit -m "chore(context): refresh the product context"
          git push
          # This push starts nothing, so the checks that failed on the commit
          # before it stay failed against a tree that is now correct. An
          # explicit dispatch is exempt from that rule and needs no PAT.
          gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}"
          echo "Regenerated, pushed, and asked CI to re-run."
