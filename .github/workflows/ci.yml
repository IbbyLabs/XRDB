name: CI
run-name: >-
  ${{
    github.event_name == 'pull_request'
      && format('Pull request checks #{0}', github.event.pull_request.number)
      || format('Main checks for {0}', github.sha)
  }}

on:
  push:
    branches:
      - main
  pull_request: {}
  # A GITHUB_TOKEN push starts no workflow, which is what stops the product
  # context refreshing itself in a loop — and what leaves the board red on a
  # tree that push has already corrected. That workflow dispatches this one
  # after it commits, so the result reflects the code rather than the moment
  # before it was fixed.
  workflow_dispatch: {}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Test (race, render path)
        # The font-face race (BUG-200) only fails under -race. The detector taxes
        # every memory access, which these tests spend on millions of pixel writes,
        # so the coverage sweeps that render per config key overran any timeout.
        # -short drops those sweeps here and the ordinary test step above still runs
        # them in full. The default is include: a new test is covered unless it
        # explicitly opts out, so nothing loses the detector by being forgotten.
        # Those sweeps are therefore race-checked by no run: dropped here, and the
        # step above carries no detector. A full -race pass on this package did not
        # finish in 2401s, so a green build says nothing about races on the render
        # path itself.
        run: go test -race -short -timeout 12m ./internal/compose/...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

  release-notice:
    name: Release notice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 22

      - name: Test
        run: node --test .github/scripts/post-discord-release.test.mjs .github/scripts/post-discord-dev-build.test.mjs

  jellyfin-plugin:
    name: Jellyfin plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/jellyfin
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Jellyfin.Plugin.Xrdb -c Release
