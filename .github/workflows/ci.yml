name: CI
run-name: >-
  ${{
    github.event_name == 'pull_request'
      && format('Pull request checks #{0}', github.event.pull_request.number)
      || format('Main checks for {0}', github.sha)
  }}

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2

      - name: Build
        run: go build ./...

      - name: Test
        # -race so concurrency regressions (e.g. shared font faces) actually fail
        # here; without it a race-only test passes whether or not the bug is present.
        run: go test -race ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

  jellyfin-plugin:
    name: Jellyfin plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/jellyfin
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Jellyfin.Plugin.Xrdb -c Release
