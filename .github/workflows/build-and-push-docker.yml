name: Build and Push Docker
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && 'Docker publish (manual)'
      || format('Docker publish {0}', github.ref_name)
  }}

# Each architecture builds on its native runner (amd64 on ubuntu-latest,
# arm64 on ubuntu-24.04-arm) instead of emulating arm64 through QEMU. Builds
# push by digest only; the merge job stitches the digests into one tagged
# multi-arch manifest.
"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

concurrency:
  group: build-and-push-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Compute version metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deployment_version: ${{ steps.meta.outputs.deployment_version }}
      dev_track_tag: ${{ steps.meta.outputs.dev_track_tag }}
      publish_dev: ${{ steps.meta.outputs.publish_dev }}
      publish_release_alias: ${{ steps.meta.outputs.publish_release_alias }}
      publish_latest: ${{ steps.meta.outputs.publish_latest }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Compute deployment version metadata
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short=7 HEAD)"
          stamp="$(date -u +'%Y%m%d.%H%M')"
          deployment_version=""
          dev_track_tag=""
          publish_dev="false"
          publish_release_alias="false"
          publish_latest="false"

          if [ "${REF_TYPE}" = "tag" ] && printf '%s' "${REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            deployment_version="${REF_NAME}"
            dev_track_tag="dev-${REF_NAME#v}"
            publish_release_alias="true"
            # :latest belongs to the highest release, so a hotfix on an older
            # line can publish without stealing it. Decided here rather than in
            # a follow-on workflow: a run started with GITHUB_TOKEN cannot
            # trigger one, so a separate promotion step would never fire.
            git fetch --force --tags origin >/dev/null 2>&1 || true
            highest="$(
              {
                printf '%s\n' "${REF_NAME}"
                git tag --list 'v*'
              } | awk '/^v[0-9]+(\.[0-9]+){2}$/ { print }' | sort -V | tail -n 1
            )"
            if [ "${REF_NAME}" = "${highest}" ]; then
              publish_latest="true"
            fi
          elif [ "${REF_TYPE}" = "branch" ] && [ "${REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            deployment_version="dev.${stamp}.${short_sha}"
            dev_track_tag="dev-${stamp/./-}-${short_sha}"
            publish_dev="true"
          else
            deployment_version="manual-${stamp}-${short_sha}"
            dev_track_tag="manual-${short_sha}"
          fi

          echo "deployment_version=${deployment_version}" >> "$GITHUB_OUTPUT"
          echo "dev_track_tag=${dev_track_tag}" >> "$GITHUB_OUTPUT"
          echo "publish_dev=${publish_dev}" >> "$GITHUB_OUTPUT"
          echo "publish_latest=${publish_latest}" >> "$GITHUB_OUTPUT"
          echo "publish_release_alias=${publish_release_alias}" >> "$GITHUB_OUTPUT"
          # ghcr image names must be lowercase.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    needs: version
    permissions:
      contents: read
      # Push per-architecture image digests to GHCR.
      packages: write
    strategy:
      matrix:
        # Single image: the web UI is statically exported and embedded in
        # the Go binary (see Dockerfile stages).
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ needs.version.outputs.image }}
          labels: |
            org.opencontainers.image.title=XRDB
            org.opencontainers.image.description=XRDB generates poster, backdrop, and logo images with ratings overlays on the fly.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            org.opencontainers.image.version=${{ needs.version.outputs.deployment_version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            XRDB_BUILD_VERSION=${{ needs.version.outputs.deployment_version }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          outputs: type=image,name=${{ needs.version.outputs.image }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Export digest
        run: echo "${{ steps.build.outputs.digest }}" > "/tmp/${{ matrix.suffix }}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: /tmp/${{ matrix.suffix }}
          archive: false
          retention-days: 1

  merge:
    name: Merge manifests and tag
    runs-on: ubuntu-latest
    needs: [version, build]
    permissions:
      contents: read
      # Publish the final tagged multi-arch manifest to GHCR.
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: '{amd64,arm64}'
          merge-multiple: true

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ needs.version.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.publish_latest == 'true' }}
            type=raw,value=dev,enable=${{ needs.version.outputs.publish_dev == 'true' }}
            type=raw,value=${{ needs.version.outputs.dev_track_tag }},enable=${{ needs.version.outputs.publish_dev == 'true' || needs.version.outputs.publish_release_alias == 'true' }}
            type=sha,prefix=manual-,enable=${{ github.event_name == 'workflow_dispatch' && needs.version.outputs.publish_dev != 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          tag_args=()
          while IFS= read -r tag; do
            if [ -n "${tag}" ]; then
              tag_args+=(-t "${tag}")
            fi
          done <<< "${TAGS}"

          if [ "${#tag_args[@]}" -eq 0 ]; then
            echo "No tags resolved for this run; refusing to push an untagged manifest." >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" \
            "${IMAGE}@$(cat /tmp/digests/amd64)" \
            "${IMAGE}@$(cat /tmp/digests/arm64)"

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "Pushed multi-arch manifest (linux/amd64, linux/arm64):"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  notify-dev:
    name: Notify Discord (dev build)
    runs-on: ubuntu-latest
    needs: [version, merge]
    if: ${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && needs.version.outputs.publish_dev == 'true' }}
    permissions:
      # Push the discord-dev-notified checkpoint tag back to the repo.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Check Discord webhook secret
        id: webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -n "${WEBHOOK_URL}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve last Discord dev notification SHA
        id: last_notification
        if: ${{ steps.webhook.outputs.enabled == 'true' }}
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          checkpoint_tag='discord-dev-notified'
          checkpoint_sha=''
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/${checkpoint_tag}" >/dev/null; then
            checkpoint_sha="$(git rev-list -n1 "refs/tags/${checkpoint_tag}")"
          fi
          before_sha="${checkpoint_sha:-${EVENT_BEFORE}}"
          skip='false'
          if [ -n "${checkpoint_sha}" ] && [ "${checkpoint_sha}" = "${GITHUB_SHA}" ]; then
            skip='true'
          fi
          echo "checkpoint_tag=${checkpoint_tag}" >> "$GITHUB_OUTPUT"
          echo "before_sha=${before_sha}" >> "$GITHUB_OUTPUT"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Post dev build to Discord
        if: ${{ steps.webhook.outputs.enabled == 'true' && steps.last_notification.outputs.skip != 'true' }}
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          DISCORD_ROLE_ID: '1500618567614206072'
          REPOSITORY: ${{ github.repository }}
          DEPLOYMENT_VERSION: ${{ needs.version.outputs.deployment_version }}
          BEFORE_SHA: ${{ steps.last_notification.outputs.before_sha }}
          AFTER_SHA: ${{ github.sha }}
          DEV_TRACK_TAG: ${{ needs.version.outputs.dev_track_tag }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./.github/scripts/post-discord-dev-build.mjs

      - name: Update Discord checkpoint tag
        if: ${{ steps.webhook.outputs.enabled == 'true' && steps.last_notification.outputs.skip != 'true' }}
        env:
          CHECKPOINT_TAG: ${{ steps.last_notification.outputs.checkpoint_tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --force "${CHECKPOINT_TAG}" "${GITHUB_SHA}"
          git push --force origin "refs/tags/${CHECKPOINT_TAG}"
