name: Build and Push Docker
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && 'Docker publish (manual)'
      || format('Docker publish {0}', github.ref_name)
  }}

# Each architecture builds on its native runner (amd64 on ubuntu-latest,
# arm64 on ubuntu-24.04-arm) instead of emulating arm64 through QEMU. Builds
# push by digest only; the merge job stitches the digests into one tagged
# multi-arch manifest after source verification passes.
"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: build-and-push-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Compute version metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deployment_version: ${{ steps.version_meta.outputs.deployment_version }}
      dev_track_tag: ${{ steps.version_meta.outputs.dev_track_tag }}
      publish_dev: ${{ steps.version_meta.outputs.publish_dev }}
      image: ${{ steps.version_meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute deployment version metadata
        id: version_meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short=7 HEAD)"
          stamp="$(date -u +'%Y%m%d.%H%M')"
          deployment_version=""
          dev_track_tag=""
          publish_dev="false"

          if [ "${REF_TYPE}" = "tag" ] && printf '%s' "${REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            deployment_version="${REF_NAME}"
            dev_track_tag=""
            publish_dev="false"
          elif [ "${REF_TYPE}" = "branch" ] && [ "${REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            git fetch --force --tags origin
            latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
            if [ -z "${latest_tag}" ]; then
              latest_tag="v0.0.0"
            fi

            base_version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "${base_version}"

            if [ "${latest_tag}" = "v0.0.0" ]; then
              subjects="$(git log --format=%s)"
              bodies="$(git log --format=%B)"
            else
              subjects="$(git log --format=%s "${latest_tag}..HEAD")"
              bodies="$(git log --format=%B "${latest_tag}..HEAD")"
            fi

            bump="patch"
            if printf '%s\n%s\n' "${subjects}" "${bodies}" | grep -Eq 'BREAKING CHANGE|BREAKING-CHANGE|^[a-zA-Z]+\([^)]+\)!:|^[a-zA-Z]+!:'; then
              bump="major"
            elif printf '%s' "${subjects}" | grep -Eq '^feat\([^)]+\):|^feat:'; then
              bump="minor"
            fi

            case "${bump}" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              *)
                patch=$((patch + 1))
                ;;
            esac

            deployment_version="dev.${stamp}.${short_sha}"
            dev_track_tag="dev-${stamp/./-}-${short_sha}"
            publish_dev="true"
          else
            deployment_version="manual-${stamp}-${short_sha}"
            dev_track_tag="manual-${short_sha}"
            publish_dev="false"
          fi

          echo "deployment_version=${deployment_version}" >> "$GITHUB_OUTPUT"
          echo "dev_track_tag=${dev_track_tag}" >> "$GITHUB_OUTPUT"
          echo "publish_dev=${publish_dev}" >> "$GITHUB_OUTPUT"
          # ghcr image names must be lowercase.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify legacy naming is absent
        run: pnpm run verify:legacy-name

      - name: Verify README doc asset manifest
        run: pnpm run docs:verify-manifest

      - name: Check docs refresh prerequisites
        id: docs_refresh
        env:
          XRDB_README_PREVIEW_TMDB_KEY: ${{ secrets.XRDB_README_PREVIEW_TMDB_KEY }}
          XRDB_README_PREVIEW_MDBLIST_KEY: ${{ secrets.XRDB_README_PREVIEW_MDBLIST_KEY }}
        run: |
          if [ -n "${XRDB_README_PREVIEW_TMDB_KEY}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "XRDB_README_PREVIEW_TMDB_KEY is not configured. Skipping full docs refresh diff."
          fi

      - name: Install Playwright browser for docs refresh
        if: ${{ steps.docs_refresh.outputs.enabled == 'true' }}
        run: npx --yes playwright install --with-deps chromium

      - name: Verify refreshed doc assets are clean
        if: ${{ steps.docs_refresh.outputs.enabled == 'true' }}
        env:
          XRDB_README_PREVIEW_TMDB_KEY: ${{ secrets.XRDB_README_PREVIEW_TMDB_KEY }}
          XRDB_README_PREVIEW_MDBLIST_KEY: ${{ secrets.XRDB_README_PREVIEW_MDBLIST_KEY }}
        run: |
          pnpm run docs:refresh-assets
          git diff --exit-code -- README.md docs/images

  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    needs: version
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.version.outputs.image }}
          labels: |
            org.opencontainers.image.title=XRDB
            org.opencontainers.image.description=XRDB generates poster, backdrop, and logo images with dynamic ratings on the fly.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            org.opencontainers.image.version=${{ needs.version.outputs.deployment_version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            XRDB_BUILD_VERSION=${{ needs.version.outputs.deployment_version }}
            NEXT_PUBLIC_DEPLOYMENT_VERSION=${{ needs.version.outputs.deployment_version }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          outputs: type=image,name=${{ needs.version.outputs.image }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Export digest
        run: echo "${{ steps.build.outputs.digest }}" > "/tmp/${{ matrix.suffix }}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/${{ matrix.suffix }}
          archive: false
          retention-days: 1

  merge:
    name: Merge manifests and tag
    runs-on: ubuntu-latest
    needs: [version, verify, build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: '{amd64,arm64}'
          merge-multiple: true

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.version.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=dev,enable=${{ needs.version.outputs.publish_dev == 'true' }}
            type=raw,value=${{ needs.version.outputs.dev_track_tag }},enable=${{ needs.version.outputs.publish_dev == 'true' }}
            type=sha,prefix=manual-,enable=${{ github.event_name == 'workflow_dispatch' && needs.version.outputs.publish_dev != 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          tag_args=()
          while IFS= read -r tag; do
            if [ -n "${tag}" ]; then
              tag_args+=(-t "${tag}")
            fi
          done <<< "${TAGS}"

          if [ "${#tag_args[@]}" -eq 0 ]; then
            echo "No tags resolved for this run; refusing to push an untagged manifest." >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" \
            "${IMAGE}@$(cat /tmp/digests/amd64)" \
            "${IMAGE}@$(cat /tmp/digests/arm64)"

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "Pushed multi-arch manifest (linux/amd64, linux/arm64):"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  notify-dev:
    name: Notify Discord (dev build)
    runs-on: ubuntu-latest
    needs: [version, merge]
    if: ${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && needs.version.outputs.publish_dev == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Discord webhook secret for dev notifications
        id: dev_webhook
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -n "${WEBHOOK_URL}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "WEBHOOK_URL secret is not configured. Skipping Discord dev build notification."
          fi

      - name: Resolve last successful Discord dev notification SHA
        id: last_dev_notification
        if: ${{ steps.dev_webhook.outputs.enabled == 'true' }}
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          checkpoint_tag='discord-dev-notified'
          checkpoint_sha=''

          git fetch --force --tags origin

          if git rev-parse -q --verify "refs/tags/${checkpoint_tag}" >/dev/null; then
            checkpoint_sha="$(git rev-list -n1 "refs/tags/${checkpoint_tag}")"
            echo "Found Discord checkpoint tag ${checkpoint_tag}: ${checkpoint_sha}"
          else
            echo "No Discord checkpoint tag found."
          fi

          before_sha="${checkpoint_sha}"
          if [ -z "${before_sha}" ]; then
            before_sha="${EVENT_BEFORE}"
            echo "Falling back to event before SHA: ${before_sha}"
          fi

          skip_notification='false'
          if [ -n "${checkpoint_sha}" ] && [ "${checkpoint_sha}" = "${GITHUB_SHA}" ]; then
            skip_notification='true'
            echo 'Current commit already has a Discord dev notification checkpoint. Skipping duplicate post.'
          fi

          echo "checkpoint_tag=${checkpoint_tag}" >> "$GITHUB_OUTPUT"
          echo "checkpoint_sha=${checkpoint_sha}" >> "$GITHUB_OUTPUT"
          echo "before_sha=${before_sha}" >> "$GITHUB_OUTPUT"
          echo "skip_notification=${skip_notification}" >> "$GITHUB_OUTPUT"

      - name: Post dev build to Discord
        if: ${{ steps.dev_webhook.outputs.enabled == 'true' && steps.last_dev_notification.outputs.skip_notification != 'true' }}
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          DISCORD_ROLE_ID: '1500618567614206072'
          REPOSITORY: ${{ github.repository }}
          DEPLOYMENT_VERSION: ${{ needs.version.outputs.deployment_version }}
          BEFORE_SHA: ${{ steps.last_dev_notification.outputs.before_sha }}
          AFTER_SHA: ${{ github.sha }}
          DEV_TRACK_TAG: ${{ needs.version.outputs.dev_track_tag }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./.github/scripts/post-discord-dev-build.mjs

      - name: Update Discord dev notification checkpoint
        if: ${{ steps.dev_webhook.outputs.enabled == 'true' && steps.last_dev_notification.outputs.skip_notification != 'true' }}
        env:
          CHECKPOINT_TAG: ${{ steps.last_dev_notification.outputs.checkpoint_tag }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git tag --force "${CHECKPOINT_TAG}" "${GITHUB_SHA}"
          git push --force origin "refs/tags/${CHECKPOINT_TAG}"
