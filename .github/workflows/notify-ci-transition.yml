name: Notify CI transition
run-name: CI transition check for ${{ github.event.workflow_run.head_sha }}

# A build that fails, then fails again, produces no news. GitHub's own run-failed
# mail fires on every red run, so it reads as noise and stops being read — which is
# how CI stayed red for twelve hours with nobody noticing the gate was open. This
# posts only when the state CHANGES, so a message here always means something is
# different from the last run rather than the same thing again.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  transition:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Post on a red/green transition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately not the shared WEBHOOK_URL: that one posts to #updates,
          # an announcement channel members follow for release news, and its
          # notices carry a role ping. A red build is developer news and belongs
          # beside the commit and build activity instead. Until CI_WEBHOOK_URL
          # exists this step does nothing rather than posting to the wrong place.
          CI_WEBHOOK_URL: ${{ secrets.CI_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CURRENT: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [ -z "${CI_WEBHOOK_URL}" ]; then
            echo "CI_WEBHOOK_URL is not configured; nothing to post."
            exit 0
          fi

          # The run before this one on the same branch. Only completed runs count:
          # an in-progress run has no conclusion and would read as a change.
          previous=$(gh api \
            "repos/${REPO}/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != ${RUN_ID})] | .[0].conclusion // \"\"")

          echo "previous=${previous:-none} current=${CURRENT}"

          # Only a change is news. Same-to-same is the state that trained everyone
          # to ignore the gate, so it stays silent.
          if [ "${previous}" = "success" ] && [ "${CURRENT}" = "failure" ]; then
            headline=":red_circle: **CI has gone red on main.** The previous run passed."
          elif [ "${previous}" = "failure" ] && [ "${CURRENT}" = "success" ]; then
            headline=":green_circle: **CI is green again on main.** The previous run failed."
          else
            echo "No transition (${previous:-none} -> ${CURRENT}); staying quiet."
            exit 0
          fi

          body=$(HEADLINE="${headline}" SHA="${SHA}" RUN_URL="${RUN_URL}" python3 -c '
          import json, os
          text = "{}\n`{}`\n{}".format(
              os.environ["HEADLINE"], os.environ["SHA"], os.environ["RUN_URL"])
          print(json.dumps({"content": text}))
          ')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' "${CI_WEBHOOK_URL}" --data "${body}")
          case "${code}" in
            2*) echo "posted (${code})" ;;
            *)  echo "post failed: http ${code}" >&2; exit 1 ;;
          esac
