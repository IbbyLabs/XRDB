# Authelia Access Control Rules for XRDB
#
# Protects the XRDB configurator UI behind Authelia while keeping image and
# proxy endpoints open so Stremio, Jellyfin, and other clients can fetch posters.
#
# =========================================================================
#  Viren070 docker-compose-template users
# =========================================================================
#
# If you run the Viren070 template (github.com/viren070/docker-compose-template)
# XRDB_HOSTNAME is likely already set in your root .env. These steps wire
# Authelia bypass rules so adding authelia@docker to XRDB does not block
# image and proxy traffic from media clients.
#
#  1. Verify root .env has the hostname
#     -----------------------------------------------------------------
#     XRDB_HOSTNAME=xrdb.${DOMAIN?}
#     -----------------------------------------------------------------
#
#  2. Add to apps/authelia/compose.yaml environment block
#     -----------------------------------------------------------------
#     TEMPLATE_XRDB_HOSTNAME: ${XRDB_HOSTNAME?}
#     -----------------------------------------------------------------
#
#  3. Paste the rule below into apps/authelia/config/configuration.yml
#     inside access_control.rules, BEFORE the wildcard catch-all
#     (the `*.{{ env "TEMPLATE_DOMAIN" }}` two_factor rule).
#
#     ## XRDB image and proxy endpoints bypass authentication for media clients
#     - domain: '{{ env "TEMPLATE_XRDB_HOSTNAME" }}'
#       policy: 'bypass'
#       resources:
#         - '^/poster(/.*)?$'
#         - '^/backdrop(/.*)?$'
#         - '^/logo(/.*)?$'
#         - '^/thumbnail(/.*)?$'
#         - '^/proxy(/.*)?$'
#         - '^/preview(/.*)?$'
#         - '^/api(/.*)?$'
#         - '^/_next(/.*)?$'
#         - '^/favicon\.ico$'
#         - '^/assets(/.*)?$'
#         - '^/fonts(/.*)?$'
#
#     The existing wildcard `*.DOMAIN` two_factor catch-all already
#     protects everything else (configurator UI, reference page) so no
#     extra rule is needed.
#
#  4. Add the Authelia middleware label to apps/xrdb/compose.yaml
#     -----------------------------------------------------------------
#     - "traefik.http.routers.xrdb.middlewares=authelia@docker"
#     -----------------------------------------------------------------
#
#  5. Recreate both containers
#     -----------------------------------------------------------------
#     docker compose --profile required --profile xrdb up -d
#     -----------------------------------------------------------------
#
# =========================================================================
#  Standalone / custom Traefik setups
# =========================================================================
#
# If you do not use the Viren070 template, paste the access_control block
# below into your Authelia configuration.yml. Add TEMPLATE_XRDB_HOSTNAME
# to your Authelia environment (set it to your actual XRDB hostname).
#
# Then add the Authelia forwardAuth middleware to your XRDB Traefik router:
#
#   - "traefik.http.routers.xrdb.middlewares=authelia@docker"
#
# The compose.yaml shipped with this repo includes a commented-out label
# you can uncomment for this purpose.

# =========================================================================
#  Authelia configuration.yml rule (paste into access_control.rules)
# =========================================================================

access_control:
  rules:
    ## XRDB image, proxy, API, and static asset endpoints bypass Authelia.
    ## Image and proxy routes are independently gated by XRDB_REQUEST_API_KEY.
    - domain: '{{ env "TEMPLATE_XRDB_HOSTNAME" }}'
      policy: 'bypass'
      resources:
        - '^/poster(/.*)?$'
        - '^/backdrop(/.*)?$'
        - '^/logo(/.*)?$'
        - '^/thumbnail(/.*)?$'
        - '^/proxy(/.*)?$'
        - '^/preview(/.*)?$'
        - '^/api(/.*)?$'
        - '^/_next(/.*)?$'
        - '^/favicon\.ico$'
        - '^/assets(/.*)?$'
        - '^/fonts(/.*)?$'
