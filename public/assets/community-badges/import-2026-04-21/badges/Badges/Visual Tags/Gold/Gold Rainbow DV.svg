    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d6d"/><stop offset="20%" stop-color="#ffb347"/><stop offset="40%" stop-color="#fff75e"/><stop offset="60%" stop-color="#7dff7a"/><stop offset="80%" stop-color="#54c6ff"/><stop offset="100%" stop-color="#d07cff"/>
