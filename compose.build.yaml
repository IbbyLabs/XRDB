services:
  # Builds the image from source before running.
  # Use this if you want to build your own image rather than pulling from GHCR.
  # For most users, compose.yaml (pre-built image) is the right choice.
  xrdb:
    build:
      context: .
      dockerfile: Dockerfile
    image: xrdb:dev
    container_name: xrdb
    env_file:
      - path: .env
        required: false
    environment:
      XRDB_ADDR: ":8787"
      XRDB_VERSION: "dev"
      XRDB_DB: "/data/xrdb.db"
      XRDB_CACHE_DIR: "/data/cache"
    ports:
      - "8787:8787"
    volumes:
      - xrdb-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8787/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  xrdb-data:
